import io.izzel.arclight.gradle.tasks.GenerateInstallerInfo
import io.izzel.arclight.gradle.tasks.RenameAsyncCatcherTask

apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'maven-publish'

sourceSets {
    applaunch {}
    forge {
        java {
            compileClasspath += main.output
            compileClasspath += main.compileClasspath
            runtimeClasspath += main.output
            runtimeClasspath += main.runtimeClasspath
        }
    }
    neoforge {
        java {
            compileClasspath += main.output
            compileClasspath += main.compileClasspath
            runtimeClasspath += main.output
            runtimeClasspath += main.runtimeClasspath
        }
    }
    fabric {}
}

configurations {
    installer {
        attributes.attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
    }
    installerFabric {
        extendsFrom installer
        attributes.attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
    }
    embedCommon
    embedFabric
    embed
    embed.extendsFrom(embedCommon, embedFabric)
    gson
    implementation.extendsFrom(embed, gson)
}

def installerLibs = [
        libs.paper.snakeyaml, libs.mysql.connectorj, libs.sqlite.jdbc, libs.json.simple,
        libs.log4j.jul, libs.specialsource, libs.commons.lang3
]

def installerLibsFabric = []

dependencies {
    implementation 'com.google.guava:guava:32.1.2-jre'
    implementation libs.asm.commons
    implementation libs.asm.tree
    implementation 'net.minecraftforge:modlauncher:10.1.2'
    implementation 'org.apache.logging.log4j:log4j-api:2.22.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.22.1'
    implementation 'org.jetbrains:annotations:23.0.0'
    implementation 'org.spongepowered:mixin:0.8.5'
    implementation 'org.apache.logging.log4j:log4j-jul:2.22.1'

    forgeImplementation "net.minecraftforge:fmlloader:${libs.versions.full.forge.get()}"
    forgeImplementation 'net.minecraftforge:securemodules:2.2.24'
    forgeImplementation 'net.minecraftforge:modlauncher:10.2.6'
    forgeImplementation 'net.minecraftforge:forgespi:8.0.0'
    forgeImplementation 'net.minecraftforge:bootstrap:2.1.8'
    forgeImplementation 'net.minecraftforge:bootstrap-api:2.1.8'

    neoforgeImplementation 'net.neoforged.fancymodloader:loader:11.0.15'

    fabricImplementation "net.fabricmc:fabric-loader:${libs.versions.fabric.loader.get()}"

    for (def lib : installerLibs) {
        installer(lib) { exclude group: 'junit', module: 'junit' }
    }
    for (def lib : installerLibsFabric) {
        installerFabric lib
    }

    installerFabric(libs.fabric.api) { transitive = false }
    installerFabric(libs.terminalconsoleappender) { exclude group: 'org.apache.logging.log4j', module: 'log4j-core' }
    installer project(':arclight-paper-api')
    installer libs.configurate.yaml
    installer platform(libs.adventure.bom)
    installer libs.adventure.ansi

    gson libs.gson

    embedCommon libs.izzel.tools
    embedCommon libs.arclight.api
    // Configurate 3 uses ninja.leaping packages; keep it separate from Paper's 4.x graph.
    embedCommon(libs.configurate.hocon) { transitive = false }
    embedCommon(libs.configurate.legacy.core) { transitive = false }
    embedCommon(libs.typesafe.config) { transitive = false }

    embedCommon 'commons-lang:commons-lang:2.6@jar'
    embedCommon(project(':i18n-config')) { transitive = false }
    embedFabric(libs.mixin.tools) { transitive = false }
    embedFabric(project(':installer')) { transitive = false }
}

jar {
    from(configurations.embedCommon.collect { it.isDirectory() ? it : zipTree(it) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'LICENSE.txt'
        exclude 'META-INF/services/**'
        exclude 'org/apache/commons/lang/enum/**'
    }
}

tasks.register('forgeJar', Jar) {
    archiveBaseName.set "arclight-forge-${libs.versions.minecraft.get()}"
    manifest.attributes 'Main-Class': 'io.izzel.arclight.server.Launcher'
    manifest.attributes 'Implementation-Title': 'Arclight'
    manifest.attributes 'Implementation-Version': "arclight-${libs.versions.minecraft.get()}-${project.version}-$gitHash"
    manifest.attributes 'Implementation-Vendor': 'Arclight Team'
    manifest.attributes 'Implementation-Timestamp': new Date().format("yyyy-MM-dd HH:mm:ss")
    manifest.attributes 'Automatic-Module-Name': 'arclight.boot'
    from(configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'LICENSE.txt'
        exclude 'META-INF/services/**'
        exclude 'org/apache/commons/lang/enum/**'
    }
    into('/') {
        it.from(project(':arclight-forge').tasks.named('shadowJar').flatMap { it.archiveFile })
        it.rename { name -> 'common.jar' }
    }
    into('/') {
        it.from(configurations.gson.collect())
        it.rename { name -> 'gson.jar' }
    }
    from sourceSets.applaunch.output
    from sourceSets.main.output
    from sourceSets.forge.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn(project(':arclight-forge').tasks.build)
}

tasks.register('neoforgeJar', Jar) {
    archiveBaseName.set "arclight-neoforge-${libs.versions.minecraft.get()}"
    manifest.attributes 'Main-Class': 'io.izzel.arclight.server.Launcher'
    manifest.attributes 'Implementation-Title': 'Arclight'
    manifest.attributes 'Implementation-Version': "arclight-${libs.versions.minecraft.get()}-${project.version}-$gitHash"
    manifest.attributes 'Implementation-Vendor': 'Arclight Team'
    manifest.attributes 'Implementation-Timestamp': new Date().format("yyyy-MM-dd HH:mm:ss")
