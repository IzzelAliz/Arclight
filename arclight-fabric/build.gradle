plugins {
    id 'architectury-plugin'
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {

}

configurations {
    mixinProcessorSupport
}

dependencies {
    implementation libs.fabric.loader
    implementation libs.fabric.api

    implementation libs.izzel.tools
    implementation libs.arclight.api
    implementation libs.mixin.tools
    annotationProcessor libs.mixin.tools
    mixinProcessorSupport libs.gson
    mixinProcessorSupport 'com.google.guava:guava:33.5.0-jre'
    mixinProcessorSupport libs.asm.util
    mixinProcessorSupport libs.asm.tree

    implementation(libs.bundles.spigot.shade) { transitive = false }
    shadowBundle(libs.bundles.spigot.shade) { transitive = false }
    implementation rootProject.ext.generatedSpigot
    shadowBundle rootProject.ext.generatedSpigot

    implementation libs.fabric.permissions.api
    include libs.fabric.permissions.api

    // XXX: for compiling (arclight-api): FabricArclightServer#registerForgeEvent
    compileOnly("net.minecraftforge:eventbus:4.0.0") { transitive = false }

    implementation(project(':i18n-config')) { transitive = false }

    common(project(path: ':arclight-common', configuration: 'runtimeElements')) { transitive = false }
    shadowBundle(project(path: ':arclight-common', configuration: 'transformProductionFabric')) { transitive = false }
    common(project(':bootstrap')) { transitive = false }
    shadowBundle(project(':bootstrap')) { transitive = false }
}

compileJava {
    // No obfuscation/refmap AP in official-only builds; retain code generators.
    options.compilerArgs += ['-processor', 'lombok.launch.AnnotationProcessorHider$AnnotationProcessor,lombok.launch.AnnotationProcessorHider$ClaimingProcessor,io.izzel.arclight.mixin.ap.EjectProvider']
    options.annotationProcessorPath = configurations.annotationProcessor + configurations.mixinProcessorSupport
}

processResources {
    def ver = "${project.version}+$gitHash"
    inputs.property 'version', ver

    filesMatching('fabric.mod.json') {
        expand 'version': ver
    }
}

shadowJar {
    exclude 'architectury.common.json'

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

loom.injectAccessWidener(tasks.named('shadowJar'))
// The bootstrap embeds the shadow JAR, not Loom's standard jar output.
loom.nestJars(tasks.named('shadowJar'), configurations.named('include'))

tasks.register('srgJar', Jar) {
    from(tasks.shadowJar.outputs.files.collect { it.isDirectory() ? it : zipTree(it) }) {
        include 'io/izzel/**'
        exclude 'io/izzel/arclight/common/mixin/**'
        exclude 'io/izzel/arclight/forge/mixin/**'
    }
    archiveClassifier.set('srg')
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = rootProject.ext.commonProject.sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}
