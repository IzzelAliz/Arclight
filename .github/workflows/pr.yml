# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Pull Request Check

on:
  pull_request:
    branches:
      - '**'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 21
      uses: actions/setup-java@v1
      with:
        java-version: '21'
    - name: Cache Gradle User Files
      uses: actions/cache@v4
      with:
        path: ~/.gradle
        key: ${{ runner.os }}-gradle-user-home-v2-${{ hashFiles('**/*.gradle', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'buildSrc/src/**', 'arclight-common/bukkit.at', 'arclight-common/extra_mapping.tsrg', 'gradle.properties') }}
    - name: Cache Gradle Files
      uses: actions/cache@v4
      with:
        path: ./.gradle
        key: ${{ runner.os }}-gradle-file-v2-${{ hashFiles('**/*.gradle', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'buildSrc/src/**', 'arclight-common/bukkit.at', 'arclight-common/extra_mapping.tsrg', 'gradle.properties') }}
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build
      run: |
        ./gradlew cleanBuild build collect --no-daemon --stacktrace
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Arclight 
        path: ./build/libs/*.jar

