comments {
  _v.comment = [
    "Repository: https://github.com/IzzelAliz/Arclight"
    "Segnalazione problemi: https://github.com/IzzelAliz/Arclight/issues"
    ""
    ""
    "Numero di versione della configurazione, non modificare."
  ]
  locale.comment = "Impostazioni della lingua/I18n"
  optimization {
    comment = "Impostazioni relative all'ottimizzazione"
    disable-data-fixer.comment = [
      "Disabilita il sistema DataFixerUpper usato per aggiornare i dati dei salvataggi"
      "Ciò può velocizzare l'avvio e il caricamento dei mondi e ridurre l'uso di memoria di 80-200 MB"
      "Arclight e i suoi sviluppatori non sono responsabili di eventuali perdite o danneggiamenti dei dati"
      "Non usare in un ambiente di produzione"
    ]
    goal-selector-update-interval.comment = [
      "Intervallo in tick per aggiornare il selettore degli obiettivi"
      "Valori più alti richiedono meno risorse"
      "Fa sì che i mob cambino i loro obiettivi meno spesso"
    ]
    use-activation-and-tracking-range.comment = "Se usare le ottimizzazioni Spigot Activation Range e Tracking Range"
  }
  async-catcher.comment = [
    "Impostazioni relative ad Async Catcher"
    "Ci sono quattro modalità di Async Catcher"
    "NONE - Continua sul thread corrente"
    "DISPATCH - Invia l'azione al thread principale senza bloccare"
    "BLOCK - Esegui nel thread principale e attendi i risultati"
    "EXCEPTION - Genera un errore"
  ]
  async-catcher.dump.comment = "Salva le informazioni dello stack trace in debug.log"
  compatibility {
    symlink-world.comment = [
      "Crea collegamenti simbolici alla cartella delle dimensioni delle mod che corrisponde al nome del mondo Bukkit"
      "L'abilitazione di questa opzione può migliorare la compatibilità con i plugin"
      "Modificare questa impostazione su un server in produzione causerà cambiamenti ai nomi dei mondi delle mod"
      "  e provocherà la perdita di dati nei plugin che si basano sui nomi dei mondi"
      "Consulta https://github.com/IzzelAliz/Arclight/wiki/World-Symlink per maggiori dettagli"
    ]
    extra-logic-worlds.comment = [
      "Logica di esecuzione dei mondi extra"
      "Se alcune mod non funzionano correttamente, cerca nei log i nomi delle classi relativi a [EXT_LOGIC] e aggiungili qui"
    ]
    forward-permission.comment = [
      "true - Inoltra la richiesta di permesso di ModLoader a Bukkit"
      "false - Disabilita l'inoltro dei permessi"
      "reverse - Inoltra la richiesta di permesso del giocatore Bukkit a ModLoader"
    ]
    valid-username-regex.comment = [
      "Espressione regolare per la verifica dei nomi utente validi. Lasciarla vuota usa la verifica vanilla"
      "La seguente consente caratteri cinesi:"
      "valid-username-regex = \"^[ -~\\\\p{sc=Han}]{1,16}$\""
      "La seguente consente a qualunque nome utente di accedere:"
      "valid-username-regex = \".+\""
    ]
    #exact-plugin-entity-damage-control.comment = [
    #  "Lascia che il plugin o la mod controlli il danno finale all'entità"
    #  "Quando impostato su true, il danno aggiunto dalle mod potrebbe essere sovrascritto dai plugin"
    #]
    isolate-plugin-class-loaders.comment = [
      "Un accesso illegale significa che un plugin carica una classe da un altro plugin che non è una sua dipendenza o dipendenza soft"
      "Quando viene fornito un nome di pacchetto, non verranno tentati accessi illegali alle classi con prefisso uguale al nome del pacchetto."
      "Questo è particolarmente utile quando si verificano problemi di caricamento delle classi."
      "Attenzione: potrebbe causare malfunzionamenti nei plugin che si basano su accessi illegali."
    ]
    isolate-adventure-from-modloader.comment = [
      "Impedisci ai plugin di caricare Kyori Adventure dal ModLoader."
      "Questa è solo un'opzione di compatibilità e rimarrà per ora. Verrà sostituita da un meccanismo migliore."
    ]
  }
  velocity {
    enable.comment = [
      "Abilita l'inoltro moderno delle informazioni dei giocatori su Velocity"
    ]
    secret.comment = [
      "Il segreto utilizzato per l'inoltro moderno delle informazioni dei giocatori su Velocity"
    ]
  }
  experimental {
    comment = [
      "Queste sono impostazioni sperimentali che possono migliorare la compatibilità o le funzionalità."
      "Se decidi di usarle, segnala i problemi che riscontri."
    ]
    replaceable-base-world-generator.comment = [
      "Questa opzione fornisce compatibilità con TerraBlender nei mondi creati da Bukkit."
      "Puoi però usarla anche per offrire più opzioni al supporto multimonde di Bukkit."
      "Non è consigliato creare dimensioni specifiche di una mod. Questo potrebbe non essere supportato."
      "In Bukkit, i generatori di chunk possono dipendere facoltativamente dal generatore di chunk Vanilla originale,"
      "mentre i provider dei biomi sostituiscono completamente la sorgente dei biomi Vanilla."
      "Se vuoi usare come base una configurazione di generazione del mondo già caricata (LevelStem),"
      "usa CUSTOM come ambiente: questo indica ad Arclight di usare 'bukkit:<name>' come level stem."
      "Le opzioni di generazione del mondo possono essere fornite da un datapack."
      "L'uso di CUSTOM ignora le opzioni di generazione del mondo specificate dal mondo."
      "Ignora anche l'impostazione WorldType, quella specificabile con -t quando si usa mv create."
      "Se necessario, crea o usa un datapack che fornisca le opzioni di generazione del mondo desiderate."
      "Impostare questa opzione per un mondo già generato può causare artefatti di generazione."
    ]
  }
}
