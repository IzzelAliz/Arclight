comments {
  _v.comment = [
    "Repository: https://github.com/IzzelAliz/Arclight"
    "Issue Tracker: https://github.com/IzzelAliz/Arclight/issues"
    ""
    ""
    "Config version number, do not edit."
  ]
  locale.comment = "Language/I18n settings"
  optimization {
    comment = "Optimization related settings"
    disable-data-fixer.comment = [
      "Disable DataFixerUpper, the system used to upgrade saved world data"
      "This may speed up startup and world loading and reduce memory usage by 80-200 MB"
      "Arclight and its developers are not responsible for any data loss or corruption"
      "Do not use this in production"
    ]
    goal-selector-update-interval.comment = [
      "Interval in ticks to update the goal selector"
      "Higher values costs less resources"
      "Cause mobs changing their goals less often"
    ]
    use-activation-and-tracking-range.comment = "Whether to use Spigot Activation Range and Tracking Range optimization"
  }
  async-catcher.comment = [
    "Async Catcher related settings"
    "There are four Async Catcher modes"
    "NONE - Continue on the current thread"
    "DISPATCH - Dispatch to the main thread without blocking"
    "BLOCK - Run in main thread and wait for results"
    "EXCEPTION - Raise an error"
  ]
  async-catcher.dump.comment = "Dump stack trace information in debug.log"
  compatibility {
    symlink-world.comment = [
      "Create symbol links to mod dimension folder that matches Bukkit world name"
      "Enable this could improve plugin compatibility"
      "Changing this on production server will cause changes to mod world names"
      "  and cause data loss on plugins relying world names"
      "See https://github.com/IzzelAliz/Arclight/wiki/World-Symlink for more detail"
    ]
    extra-logic-worlds.comment = [
      "Extra worlds running logic"
      "If any mods do not function well, try search class names in logs related to [EXT_LOGIC] and add them here"
    ]
    forward-permission.comment = [
      "true - Forward ModLoader permission queries to Bukkit"
      "false - Disable permission forward"
      "reverse - Forward Bukkit player permission queries to ModLoader"
    ]
    valid-username-regex.comment = [
      "Regex for valid username check. Leave it blank will fallback to vanilla check"
      "Following allows Chinese characters:"
      "valid-username-regex = \"^[ -~\\\\p{sc=Han}]{1,16}$\""
      "Following allows any username to login:"
      "valid-username-regex = \".+\""
    ]
    #exact-plugin-entity-damage-control.comment = [
    #  "Let plugin or mod controls the final entity damage"
    #  "When set to true, mod added damage will potentially be overridden by plugins"
    #]
    isolate-plugin-class-loaders.comment = [
      "An illegal access means that a plugin loads a class from another plugin that is not a depend or soft-depend of itself"
      "When a package name is given, no illegal access will be attempted on classes prefixed with the package name."
      "This is especially useful when class loading issues happen."
      "Beware that it may break plugins relying on illegal access."
    ]
    isolate-adventure-from-modloader.comment = [
      "Prevent plugins from loading Kyori Adventure from ModLoader."
      "This is only a compatibility option and persists for now. Will be replaced with a better mechanism."
    ]
  }
  velocity {
    enable.comment = [
      "Enable Velocity modern player info forwarding"
    ]
    secret.comment = [
      "The secret used in Velocity modern player info forwarding"
    ]
  }
  experimental {
    comment = [
      "These are experimental settings that may improve your compatibility or functionality."
      "Please report the problems you encounter if you decide to use these."
    ]
    replaceable-base-world-generator.comment = [
      "This is here to provide compatibility with TerraBlender in Bukkit created worlds."
      "However, you can also use it to provide more options for Bukkit's multi world support."
      "It's not recommended to create dimensions specific to a mod. This may not be supported."
      "In Bukkit, chunk generators can optionally depend on the original Vanilla chunk generator,"
      "while biome providers completely override the Vanilla biome source."
      "In case you want to use already loaded worldgen config (LevelStem) as the base,"
      "use CUSTOM as the Environment, which instructs Arclight to use 'bukkit:<name>' as the level stem."
      "The worldgen options can be provided by a datapack."
      "Using CUSTOM will bypass the worldgen options specified by the world."
      "This will also bypass the WorldType setting. The one that can be specified with -t when using mv create."
      "If you really need it, make or use a data pack that provides the desired worldgen options."
      "Setting this for an already generated world may lead to tearing."
    ]
  }
}
