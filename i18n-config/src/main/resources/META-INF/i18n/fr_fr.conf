comments {
  _v.comment = [
    "Dépôt : https://github.com/IzzelAliz/Arclight"
    "Suivi des problèmes : https://github.com/IzzelAliz/Arclight/issues"
    ""
    ""
    "Numéro de version de la configuration, ne pas modifier."
  ]
  locale.comment = "Paramètres de langue/internationalisation"
  optimization {
    comment = "Paramètres liés à l'optimisation"
    disable-data-fixer.comment = [
      "Désactiver le système DataFixerUpper utilisé pour mettre à niveau les données des mondes."
      "Cela peut accélérer le démarrage et le chargement des mondes, et réduire l'utilisation de la mémoire de 80 à 200 Mo."
      "Arclight et ses développeurs ne sont responsables d'aucune perte ou corruption de données."
      "NE PAS UTILISER EN PRODUCTION !"
    ]
    goal-selector-update-interval.comment = [
      "Intervalle, en ticks, de mise à jour du sélecteur d'objectifs"
      "Des valeurs plus élevées consomment moins de ressources"
      "Les créatures changent alors moins souvent d'objectif"
    ]
    use-activation-and-tracking-range.comment = "Indique s'il faut utiliser les optimisations Spigot Activation Range et Tracking Range"
  }
  async-catcher.comment = [
    "Paramètres liés à Async Catcher"
    "Il existe quatre modes Async Catcher"
    "NONE - Continuer sur le thread actuel"
    "DISPATCH - Répartir l'action sur le thread principal sans bloquer"
    "BLOCK - Exécuter sur le thread principal et attendre les résultats"
    "EXCEPTION - Lever une erreur"
  ]
  async-catcher.dump.comment = "Écrire les informations de la trace de pile dans debug.log"
  compatibility {
    symlink-world.comment = [
      "Créer des liens symboliques vers les dossiers de dimensions de mods correspondant au nom du monde Bukkit"
      "L'activation de cette option peut améliorer la compatibilité des plugins"
      "Modifier cette option sur un serveur de production changera les noms des mondes de mods"
      "  et entraînera une perte de données pour les plugins qui dépendent des noms de mondes"
      "Consultez https://github.com/IzzelAliz/Arclight/wiki/World-Symlink pour plus de détails"
    ]
    extra-logic-worlds.comment = [
      "Mondes supplémentaires exécutant de la logique"
      "Si des mods ne fonctionnent pas correctement, cherchez dans les journaux les noms de classes associés à [EXT_LOGIC] et ajoutez-les ici"
    ]
    forward-permission.comment = [
      "true - Transférer la requête de permission de ModLoader à Bukkit"
      "false - Désactiver le transfert de permissions"
      "reverse - Transférer la requête de permission du joueur Bukkit à ModLoader"
    ]
    valid-username-regex.comment = [
      "Expression régulière de validation des noms d'utilisateur. La laisser vide utilise la vérification Vanilla"
      "L'exemple suivant autorise les caractères chinois :"
      "valid-username-regex = \"^[ -~\\\\p{sc=Han}]{1,16}$\""
      "L'exemple suivant autorise n'importe quel nom d'utilisateur à se connecter :"
      "valid-username-regex = \".+\""
    ]
    isolate-plugin-class-loaders.comment = [
      "Un accès illégal signifie qu'un plugin charge une classe provenant d'un autre plugin qui n'est ni une dépendance ni une dépendance facultative du premier."
      "Lorsqu'un nom de package est indiqué, aucun accès illégal ne sera tenté pour les classes dont le préfixe correspond à ce package."
      "Ceci est particulièrement utile en cas de problèmes de chargement de classes."
      "Attention : cela peut casser les plugins qui dépendent d'accès illégaux."
    ]
    isolate-adventure-from-modloader.comment = [
      "Empêcher les plugins de charger Kyori Adventure depuis le chargeur de mods."
      "Il ne s'agit pour l'instant que d'une option de compatibilité. Elle sera remplacée par un meilleur mécanisme."
    ]
  }
  velocity {
    enable.comment = [
      "Activer le transfert moderne des informations de joueur de Velocity"
    ]
    secret.comment = [
      "Secret utilisé pour le transfert moderne des informations de joueur de Velocity"
    ]
  }
  experimental {
    comment = [
      "Ces paramètres expérimentaux peuvent améliorer votre compatibilité ou vos fonctionnalités."
      "Si vous décidez de les utiliser, signalez les problèmes que vous rencontrez."
    ]
    replaceable-base-world-generator.comment = [
      "Cette option assure la compatibilité avec TerraBlender dans les mondes créés par Bukkit."
      "Elle peut aussi fournir davantage d'options pour la prise en charge des mondes multiples de Bukkit."
      "Il n'est pas recommandé de créer des dimensions propres à un mod. Ce cas peut ne pas être pris en charge."
      "Dans Bukkit, les générateurs de chunks peuvent éventuellement dépendre du générateur de chunks Vanilla d'origine,"
      "tandis que les fournisseurs de biomes remplacent entièrement la source de biomes Vanilla."
      "Si vous souhaitez utiliser comme base une configuration de génération de monde (LevelStem) déjà chargée,"
      "utilisez CUSTOM comme environnement ; cela demande à Arclight d'utiliser 'bukkit:<name>' comme LevelStem."
      "Les options de génération du monde peuvent être fournies par un paquet de données."
      "L'utilisation de CUSTOM ignore les options de génération du monde définies par le monde."
      "Cela ignore aussi le paramètre WorldType, celui qui peut être indiqué avec -t lors de l'utilisation de mv create."
      "Si vous en avez réellement besoin, créez ou utilisez un paquet de données fournissant les options de génération de monde souhaitées."
      "Définir cette option pour un monde déjà généré peut entraîner des déchirures."
    ]
  }
}
