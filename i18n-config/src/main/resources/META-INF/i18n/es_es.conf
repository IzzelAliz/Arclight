comments {
  _v.comment = [
    "Repositorio: https://github.com/IzzelAliz/Arclight"
    "Rastreador de incidencias: https://github.com/IzzelAliz/Arclight/issues"
    ""
    ""
    "Número de versión de la configuración; no lo edites."
  ]
  locale.comment = "Configuración de idioma/internacionalización"
  optimization {
    comment = "Configuración relacionada con la optimización"
    disable-data-fixer.comment = [
      "Desactiva el sistema DataFixerUpper utilizado para actualizar los datos de los mundos."
      "Esto puede acelerar el inicio y la carga de los mundos, y reducir el uso de memoria entre 80 y 200 MB."
      "Arclight y sus desarrolladores no se responsabilizan de ninguna pérdida o corrupción de datos."
      "¡NO LO USES EN PRODUCCIÓN!"
    ]
    goal-selector-update-interval.comment = [
      "Intervalo en ticks para actualizar el selector de objetivos"
      "Los valores más altos consumen menos recursos"
      "Hace que las criaturas cambien de objetivo con menos frecuencia"
    ]
    use-activation-and-tracking-range.comment = "Indica si se deben usar las optimizaciones Spigot Activation Range y Tracking Range"
  }
  async-catcher.comment = [
    "Configuración relacionada con Async Catcher"
    "Hay cuatro modos de Async Catcher"
    "NONE - Continuar en el hilo actual"
    "DISPATCH - Enviar la acción al hilo principal sin bloquear"
    "BLOCK - Ejecutar en el hilo principal y esperar los resultados"
    "EXCEPTION - Generar un error"
  ]
  async-catcher.dump.comment = "Volcar la información de la traza de pila en debug.log"
  compatibility {
    symlink-world.comment = [
      "Crear enlaces simbólicos a la carpeta de dimensiones de mods que coincida con el nombre del mundo de Bukkit"
      "Activar esta opción puede mejorar la compatibilidad de los complementos"
      "Cambiar esta opción en un servidor de producción modificará los nombres de los mundos de mods"
      "  y causará pérdida de datos en los complementos que dependen de los nombres de mundo"
      "Consulta https://github.com/IzzelAliz/Arclight/wiki/World-Symlink para más detalles"
    ]
    extra-logic-worlds.comment = [
      "Mundos adicionales que ejecutan lógica"
      "Si algún mod no funciona correctamente, intenta buscar en los registros los nombres de clase relacionados con [EXT_LOGIC] y añádelos aquí"
    ]
    forward-permission.comment = [
      "true - Reenviar la consulta de permisos de ModLoader a Bukkit"
      "false - Desactivar el reenvío de permisos"
      "reverse - Reenviar la consulta de permisos del jugador de Bukkit a ModLoader"
    ]
    valid-username-regex.comment = [
      "Expresión regular para validar nombres de usuario. Si la dejas vacía, se usará la validación Vanilla"
      "Lo siguiente permite caracteres chinos:"
      "valid-username-regex = \"^[ -~\\\\p{sc=Han}]{1,16}$\""
      "Lo siguiente permite iniciar sesión con cualquier nombre de usuario:"
      "valid-username-regex = \".+\""
    ]
    isolate-plugin-class-loaders.comment = [
      "Un acceso ilegal significa que un complemento carga una clase de otro complemento que no es una dependencia ni una dependencia opcional suya."
      "Cuando se proporciona un nombre de paquete, no se intentará ningún acceso ilegal a las clases cuyo prefijo coincida con el paquete."
      "Esto es especialmente útil cuando ocurren problemas de carga de clases."
      "Ten en cuenta que puede romper complementos que dependen de accesos ilegales."
    ]
    isolate-adventure-from-modloader.comment = [
      "Evitar que los complementos carguen Kyori Adventure desde el cargador de mods."
      "Por ahora, esta es solo una opción de compatibilidad. Se sustituirá por un mecanismo mejor."
    ]
  }
  velocity {
    enable.comment = [
      "Activar el reenvío moderno de información de jugadores de Velocity"
    ]
    secret.comment = [
      "El secreto usado para el reenvío moderno de información de jugadores de Velocity"
    ]
  }
  experimental {
    comment = [
      "Estos ajustes experimentales pueden mejorar tu compatibilidad o funcionalidad."
      "Si decides usarlos, informa de los problemas que encuentres."
    ]
    replaceable-base-world-generator.comment = [
      "Esta opción proporciona compatibilidad con TerraBlender en mundos creados por Bukkit."
      "Sin embargo, también puedes usarla para ofrecer más opciones para la compatibilidad con varios mundos de Bukkit."
      "No se recomienda crear dimensiones específicas de un mod. Puede que este caso no sea compatible."
      "En Bukkit, los generadores de chunks pueden depender opcionalmente del generador de chunks Vanilla original,"
      "mientras que los proveedores de biomas sustituyen completamente la fuente de biomas Vanilla."
      "Si quieres usar como base una configuración de generación de mundo (LevelStem) ya cargada,"
      "usa CUSTOM como entorno; esto indica a Arclight que use 'bukkit:<name>' como LevelStem."
      "Las opciones de generación de mundo pueden proporcionarse mediante un paquete de datos."
      "El uso de CUSTOM omitirá las opciones de generación de mundo especificadas por el mundo."
      "Esto también omitirá el ajuste WorldType, el que se puede especificar con -t al usar mv create."
      "Si realmente lo necesitas, crea o usa un paquete de datos que proporcione las opciones de generación de mundo deseadas."
      "Configurar esto para un mundo ya generado puede provocar desgarros."
    ]
  }
}
