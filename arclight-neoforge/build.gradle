plugins {
    id 'architectury-plugin'
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    neoForge {
    }
}

dependencies {
    neoForge libs.neoforge

    implementation libs.izzel.tools
    implementation libs.arclight.api
    implementation libs.mixin.tools

    implementation project(':arclight-paper-api')
    shadowBundle(project(':arclight-paper-api')) { transitive = false }
    implementation libs.jline
    shadowBundle(libs.jline) { transitive = false }

    // XXX: for compiling (arclight-api): NeoForgeArclightServer#registerForgeEvent
    compileOnly("net.minecraftforge:eventbus:4.0.0") { transitive = false }

    implementation(project(':i18n-config')) { transitive = false }

    common(project(path: ':arclight-common', configuration: 'runtimeElements')) { transitive = false }
    shadowBundle(project(path: ':arclight-common', configuration: 'transformProductionNeoForge')) { transitive = false }
}

processResources {
    def ver = "${project.version}+$gitHash"
    inputs.property 'version', ver

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': ver
    }
}

shadowJar {
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'
    exclude 'arclight.accesswidener'
    from(loom.accessWidenerPath)

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

loom.getNeoForge().convertAccessWideners(tasks.named('shadowJar'), loom.accessWidenerPath.get().asFile.name)

tasks.register('srgJar', Jar) {
    from(tasks.shadowJar.outputs.files.collect { it.isDirectory() ? it : zipTree(it) }) {
        include 'io/izzel/**'
        exclude 'io/izzel/arclight/common/mixin/**'
        exclude 'io/izzel/arclight/forge/mixin/**'
    }
    archiveClassifier.set('srg')
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = rootProject.ext.commonProject.sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}
