terminal-console-appender = '1.2.0'
log4j = '2.22.1'
snakeyaml = '2.0'
mysql-connector-j = '8.4.0'


[plugins]
architectury = { id = 'architectury-plugin', version.ref = 'architectury-plugin' }
shadow = { id = 'com.gradleup.shadow', version.ref = 'gradleup-shadow' }

[libraries]
sqlite-jdbc = { module = 'org.xerial:sqlite-jdbc', version.ref = 'sqlite-jdbc' }
configurate-yaml = { module = 'org.spongepowered:configurate-yaml', version.ref = 'configurate-paper' }
json-simple = { module = 'com.googlecode.json-simple:json-simple', version.ref = 'json-simple' }
adventure-ansi = { module = 'net.kyori:adventure-text-serializer-ansi' }

# Paper API dependencies
paper-guava = { module = 'com.google.guava:guava', version.ref = 'paper-guava' }
paper-gson = { module = 'com.google.code.gson:gson', version.ref = 'paper-gson' }
paper-snakeyaml = { module = 'org.yaml:snakeyaml', version.ref = 'paper-snakeyaml' }
joml = { module = 'org.joml:joml', version.ref = 'joml' }
fastutil = { module = 'it.unimi.dsi:fastutil', version.ref = 'fastutil' }
paper-log4j-api = { module = 'org.apache.logging.log4j:log4j-api', version.ref = 'paper-log4j' }
slf4j = { module = 'org.slf4j:slf4j-api', version.ref = 'slf4j' }
brigadier = { module = 'com.mojang:brigadier', version.ref = 'brigadier' }
paper-bungeecord = { module = 'net.md-5:bungeecord-chat', version.ref = 'paper-bungeecord' }
adventure-bom = { module = 'net.kyori:adventure-bom', version.ref = 'adventure' }
maven-provider = { module = 'org.apache.maven:maven-resolver-provider', version.ref = 'maven-provider' }
maven-resolver-connector = { module = 'org.apache.maven.resolver:maven-resolver-connector-basic', version.ref = 'maven-resolver' }
maven-resolver-http = { module = 'org.apache.maven.resolver:maven-resolver-transport-http', version.ref = 'maven-resolver' }
paper-annotations = { module = 'org.jetbrains:annotations', version.ref = 'paper-annotations' }
checker-qual = { module = 'org.checkerframework:checker-qual', version.ref = 'checker-qual' }
jspecify = { module = 'org.jspecify:jspecify', version.ref = 'jspecify' }
adventure-api = { module = 'net.kyori:adventure-api' }
adventure-text-minimessage = { module = 'net.kyori:adventure-text-minimessage' }
adventure-text-serializer-gson = { module = 'net.kyori:adventure-text-serializer-gson' }
adventure-text-serializer-legacy = { module = 'net.kyori:adventure-text-serializer-legacy' }
adventure-text-serializer-plain = { module = 'net.kyori:adventure-text-serializer-plain' }
adventure-text-logger-slf4j = { module = 'net.kyori:adventure-text-logger-slf4j' }

# common
lombok = { module = 'org.projectlombok:lombok', version.ref = 'lombok' }
jetbrains-annotations = { module = 'org.jetbrains:annotations', version.ref = 'jetbrains-annotations' }

# buildSrc
jgit = { module = 'org.eclipse.jgit:org.eclipse.jgit', version = '7.8.0.202609011348-r' }
diff4j = { module = 'com.cloudbees:diff4j', version = '1.2' }
loom = { module = 'dev.architectury:architectury-loom', version.ref = 'architectury-loom' }

asm-commons = { module = 'org.ow2.asm:asm-commons', version.ref = 'asm' }
asm-tree = { module = 'org.ow2.asm:asm-tree', version.ref = 'asm' }
asm-util = { module = 'org.ow2.asm:asm-util', version.ref = 'asm' }
commons-io = { module = 'commons-io:commons-io', version.ref = 'commons-io' }
commons-lang3 = { module = 'org.apache.commons:commons-lang3', version.ref = 'commons-lang3' }

lorenz-core = { module = 'org.cadixdev:lorenz', version.ref = 'lorenz' }
lorenz-proguard = { module = 'org.cadixdev:lorenz-io-proguard', version.ref = 'lorenz-io-proguard' }
lorenz-tiny = { module = 'net.fabricmc:lorenz-tiny', version.ref = 'fabric-lorenz-tiny' }
at = { module = 'org.cadixdev:at', version.ref = 'cadixdev-at' }
mercury = { module = 'dev.architectury:mercury', version.ref = 'cadixdev-mercury' }
specialsource = { module = 'net.md-5:SpecialSource', version.ref = 'special-source' }

# subProjects (arclight-common, and other in platforms)
minecraft = { module = 'com.mojang:minecraft', version.ref = 'minecraft' }
spigot-api = { module = 'org.spigotmc:spigot-api', version.ref = 'spigot-api' }
bungeecord-chat = { module = 'net.md-5:bungeecord-chat', version.ref = 'bungeecord-chat-api' }
bungeecord-dialog = { module = 'net.md-5:bungeecord-dialog', version.ref = 'bungeecord-chat-api' }
bungeecord-serializer = { module = 'net.md-5:bungeecord-serializer', version.ref = 'bungeecord-chat-api' }
snakeyaml = { module = 'org.yaml:snakeyaml', version.ref = 'snakeyaml' }
mysql-connectorj = { module = 'com.mysql:mysql-connector-j', version.ref = 'mysql-connector-j' }
jline = { module = 'org.jline:jline', version.ref = 'jline' }
terminalconsoleappender = { module = 'net.minecrell:terminalconsoleappender', version.ref = 'terminal-console-appender' }
log4j-api = { module = 'org.apache.logging.log4j:log4j-api', version.ref = 'log4j' }
log4j-core = { module = 'org.apache.logging.log4j:log4j-core', version.ref = 'log4j' }
log4j-jul = { module = 'org.apache.logging.log4j:log4j-jul', version.ref = 'log4j' }

arclight-api = { module = 'io.izzel.arclight:arclight-api', version.ref = 'arclight-api' }
izzel-tools = { module = 'io.izzel:tools', version.ref = 'izzel-tools' }
mixin-tools = { module = 'io.izzel.arclight:mixin-tools', version.ref = 'mixin-tools' }

# platforms (arclight-forge, arclight-fabric, arclight-neoforge)
forge = { module = 'net.minecraftforge:forge', version.ref = 'full-forge' }
fabric-loader = { module = 'net.fabricmc:fabric-loader', version.ref = 'fabric-loader' }
fabric-api = { module = 'net.fabricmc.fabric-api:fabric-api', version.ref = 'fabric-api' }
fabric-permissions-api = { module ='me.lucko:fabric-permissions-api', version.ref = 'fabric-permissions-api' }
neoforge = { module ='net.neoforged:neoforge', version.ref = 'neoforge' }

# installer
gson = { module = 'com.google.code.gson:gson', version.ref = 'gson' }

# i18n-config
configurate-legacy-core = { module = 'org.spongepowered:configurate-core', version.ref = 'hocon' }
typesafe-config = { module = 'com.typesafe:config', version.ref = 'typesafe-config' }
configurate-hocon = { module = 'org.spongepowered:configurate-hocon', version.ref = 'hocon' }

# bootstrap
sponge-mixin = { module = 'org.spongepowered:mixin', version.ref = 'mixin' }

[bundles]
asm = ['asm-commons', 'asm-tree', 'asm-util']
lorenz = ['lorenz-core', 'lorenz-proguard', 'lorenz-tiny']
log4j = ['log4j-api', 'log4j-core', 'log4j-jul']
spigot-shade = ['spigot-api', 'bungeecord-chat', 'bungeecord-dialog', 'bungeecord-serializer', 'jline']
spigot-runtime = ['spigot-api', 'snakeyaml', 'mysql-connectorj', 'bungeecord-chat', 'bungeecord-dialog', 'bungeecord-serializer', 'jline']
