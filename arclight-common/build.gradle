plugins {
    id 'architectury-plugin'
}

architectury {
    common(rootProject.ext.supportedPlatforms)
}

loom {
    accessWidenerPath = file('src/main/resources/arclight.accesswidener')

}

sourceSets.main {
    java.srcDir rootProject.layout.buildDirectory.dir('paper-patched/paper-server/paper-server/src/main/java')
    java.srcDir rootProject.layout.buildDirectory.dir('paper-patched/paper-server/paper-server/src/generated/java')
    resources {
        srcDir rootProject.layout.buildDirectory.dir('paper-patched/paper-server/paper-server/src/main/resources')
        // The pinned upstream retains these obsolete descriptors without their service types/providers.
        // Keep the actual plugin, lifecycle, registry and Adventure providers from the patched server tree.
        exclude 'META-INF/services/io.papermc.paper.command.brigadier.CommandBuilderProvider'
        exclude 'META-INF/services/io.papermc.paper.world.flag.FeatureFlags$FeatureFlagProvider'
    }
}
tasks.named('compileJava') { dependsOn rootProject.tasks.named('applyPaperPatches') }
tasks.named('processResources') {
    dependsOn rootProject.tasks.named('applyPaperPatches')
    from(rootProject.layout.buildDirectory.dir('paper-patched/paper-server')) {
        include 'LICENSE.md', 'licenses/**'
        into 'META-INF/paper-server'
    }
    from(rootProject.layout.buildDirectory.dir('paper-patched/paper-server/paper-server/src/main/resources/data/minecraft/datapacks/paper')) {
        include 'data/paper/chat_type/raw.json'
    }
}
tasks.named('sourcesJar') { dependsOn rootProject.tasks.named('applyPaperPatches') }

configurations {
    mixinProcessorSupport
    compileClasspath {
        // Shared classes must retain scalar Redirect.at metadata understood by
        // NeoForge's Mixin/MixinExtras; Fabric also accepts that representation.
        resolutionStrategy.force 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'
    }
}

dependencies {
    implementation libs.fabric.loader

    implementation project(':arclight-paper-api')
    implementation libs.configurate.yaml
    implementation(libs.json.simple) { transitive = false }
    implementation platform(libs.adventure.bom)
    implementation libs.adventure.ansi

    implementation libs.izzel.tools
    implementation libs.arclight.api
    implementation libs.mixin.tools
    annotationProcessor libs.mixin.tools
    mixinProcessorSupport libs.gson
    mixinProcessorSupport 'com.google.guava:guava:33.5.0-jre'
    mixinProcessorSupport libs.asm.util
    mixinProcessorSupport libs.asm.tree

    implementation libs.jline
    implementation libs.terminalconsoleappender
    implementation libs.commons.lang3
    implementation libs.specialsource
    implementation libs.log4j.jul
    implementation libs.mysql.connectorj
    implementation libs.snakeyaml

    implementation project(':i18n-config')
}

compileJava {
    // No obfuscation/refmap AP in official-only builds; retain code generators.
    options.compilerArgs += ['-processor', 'lombok.launch.AnnotationProcessorHider$AnnotationProcessor,lombok.launch.AnnotationProcessorHider$ClaimingProcessor,io.izzel.arclight.mixin.ap.EjectProvider']
    options.compilerArgs << '-XDignore.symbol.file' << '-XDenableSunApiLintControl'
    options.annotationProcessorPath = configurations.annotationProcessor + configurations.mixinProcessorSupport
    options.encoding = 'UTF-8'
}
