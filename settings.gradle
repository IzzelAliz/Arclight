pluginManagement {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.architectury.dev/' }
        maven { url 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'arclight'

include 'installer'
include 'i18n-config'

include 'arclight-common'

include 'arclight-neoforge'
include 'arclight-fabric'

// Forge 26.1: Architectury Loom McpExecutor NPE (B-04) — re-enable when loom fixes unobfuscated Forge setup
if (gradle.startParameter.projectProperties.getOrDefault('enableForge', 'false') == 'true') {
    include 'arclight-forge'
}

include 'bootstrap'
